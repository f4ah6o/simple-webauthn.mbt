name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Install MoonBit CLI
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | MOONBIT_INSTALL_VERSION="0.10.14+7d59c7ec9" bash
          "$HOME/.moon/bin/moon" version --all
          case "$("$HOME/.moon/bin/moon" version)" in
            "moon 0.1.20260920 (914d7da "*) ;;
            *) echo "Unexpected Moon CLI build" >&2; exit 1 ;;
          esac
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Moon update
        run: moon update
      - name: Moon format check
        run: moon fmt --check
      - name: Moon check
        run: moon check --target js
      - name: Moon test
        run: moon test --target js
